<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画像校正チェック</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }

     /* ←ここに追加 */
     #dropZone {
      margin-top: 12px;
      padding: 28px 16px;
      border: 2px dashed #bbb;
      border-radius: 12px;
      text-align: center;
      background: #fafafa;
      transition: 0.2s ease;
    }

    #dropZone.dragover {
      border-color: #4f46e5;
      background: #eef2ff;
    } 

    h1 {
      margin-bottom: 24px;
    }
    .row {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    textarea, input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 14px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      margin-top: 8px;
    }
    pre {
      background: #f6f6f6;
      padding: 16px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 8px;
    }
    .hint {
      color: #666;
      font-size: 13px;
      margin-top: 6px;
    }
    #previewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    #previewContainer img {
      max-width: 100%;
      max-height: 280px;
      width: auto;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      object-fit: contain;
    }
    #officialPreviewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    #officialPreviewContainer img {
      max-height: 160px;
      max-width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      object-fit: contain;
    }
    .btn-secondary {
      margin-top: 8px;
      background: #f0f0f0;
      border: 1px solid #ccc;
    }
    .result-card {
  background: #f8f8f8;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 16px;
  margin-top: 16px;
}

.result-header {
  padding: 16px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 20px;
}

.result-ok {
  background: #e8f7e8;
  border: 1px solid #7cc67c;
}

.result-fix {
  background: #fdeaea;
  border: 1px solid #e38b8b;
}

.result-check {
  background: #fff7e6;
  border: 1px solid #e7c46a;
}

.result-card h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 18px;
}

.result-card ul {
  margin: 8px 0 0;
  padding-left: 20px;
}

.result-card li {
  margin-bottom: 6px;
}

.result-grid {
  display: grid;
  gap: 16px;
}

.result-row {
  margin-bottom: 8px;
}

.result-label {
  font-weight: bold;
}

.result-muted {
  color: #666;
}

.result-empty {
  color: #888;
  font-style: italic;
}
  </style>
</head>
<body>
  <h1>画像校正・商品情報照合</h1>

  <div class="row">
    <label for="imageFile">画像（複数可）</label>
    <input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
    <div id="dropZone">
      ここに画像をドラッグ＆ドロップ
      <div class="hint">または上のボタンから選択</div>
    </div>
    <div class="hint">PNG / JPG / GIF / WEBP を1枚以上選択（Ctrl / Shift で複数選択可）</div>
    <div id="previewContainer"></div>
  </div>

  <div class="row">
    <div style="font-weight:bold;margin-bottom:8px;">正式情報</div>
    <div class="hint" style="margin-bottom:8px;">
      次のいずれか（または両方）: <strong>テキスト貼り付け</strong>／<strong>スプシや公式情報のスクショ</strong>。
      どちらか片方だけでも利用可。両方ある場合は<strong>テキストを優先</strong>し、スクショは<strong>補助</strong>として判定に使います。
    </div>
    <label for="officialText" style="font-weight:bold;">① テキスト貼り付け（スプシコピーなど）</label>
    <textarea id="officialText" placeholder="任意。貼り付けない場合は下のスクショのみでも可"></textarea>
    <label for="officialImageFile" style="margin-top:12px;">② スプシ・公式情報のスクショ（任意・複数可）</label>
    <input type="file" id="officialImageFile" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
    <div class="hint">「取り込み」で①にテキスト反映可能。取り込まず②だけでも照合できます。①と②があるときは①が正、②は補助です。</div>
    <div id="officialPreviewContainer"></div>
    <button type="button" id="importOfficialBtn" class="btn-secondary">スクショから正式情報を取り込む（テキスト欄に反映）</button>
    <p id="officialImportStatus" class="hint" style="margin-top:8px;"></p>
  </div>

  <div class="row">
    <label for="referenceUrl">参照URL（任意）</label>
    <input type="text" id="referenceUrl" placeholder="https://example.com" />
  </div>

  <div class="row">
    <button id="runBtn">チェック実行</button>
  </div>

  <h2>結果</h2>
  <div id="result">ここに結果が表示されます</div>

  <script>
    async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          const base64 = result.split(",")[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  
    function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderList(items) {
  if (!items || items.length === 0) {
    return `<div class="result-empty">なし</div>`;
  }
  return `<ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
}

function renderResult(data) {
  const conclusion = data.conclusion || "要確認";

  let headerClass = "result-check";
  if (conclusion === "OK") headerClass = "result-ok";
  if (conclusion === "修正必要") headerClass = "result-fix";

  return `
    <div class="result-grid">
      <div class="result-header ${headerClass}">
        判定結果：${escapeHtml(conclusion)}
      </div>

      <div class="result-card">
        <h3>比較結果</h3>
        <div class="result-row"><span class="result-label">商品名：</span>${escapeHtml(data.comparison?.product_name || "")}</div>
        <div class="result-row"><span class="result-label">価格：</span>${escapeHtml(data.comparison?.price || "")}</div>
        <div class="result-row"><span class="result-label">容量：</span>${escapeHtml(data.comparison?.volume || "")}</div>
        <div class="result-row"><span class="result-label">発売日：</span>${escapeHtml(data.comparison?.release_date || "")}</div>
        <div class="result-row"><span class="result-label">説明文：</span>${escapeHtml(data.comparison?.description || "")}</div>
      </div>

      <div class="result-card">
        <h3>ルール違反</h3>
        ${renderList(data.rule_violations)}
      </div>

      <div class="result-card">
        <h3>一致項目</h3>
        ${renderList(data.accuracy?.matches)}
      </div>

      <div class="result-card">
        <h3>注意</h3>
        ${renderList(data.accuracy?.warnings)}
      </div>

      <div class="result-card">
        <h3>薬機リスク</h3>
        <div class="result-row"><span class="result-label">ステータス：</span>${escapeHtml(data.yakki_risk?.status || "")}</div>
        <div class="result-row"><span class="result-label">注意語：</span></div>
        ${renderList(data.yakki_risk?.terms)}
        <div class="result-row" style="margin-top:12px;"><span class="result-label">メモ：</span></div>
        ${renderList(data.yakki_risk?.notes)}
      </div>

      <div class="result-card">
        <h3>修正ポイント</h3>
        ${renderList(data.fix_points)}
      </div>

      <div class="result-card">
        <h3>スペース監査</h3>
        <div class="result-row"><span class="result-label">正式情報：</span>${escapeHtml(data.space_audit?.official_visible || "")}</div>
        <div class="result-row"><span class="result-label">画像内：</span>${escapeHtml(data.space_audit?.image_visible || "")}</div>
        <div class="result-row"><span class="result-label">結果：</span>${escapeHtml(data.space_audit?.result || "")}</div>
      </div>
    </div>
  `;
}

    const imageInput = document.getElementById("imageFile");
    const dropZone = document.getElementById("dropZone");
    const previewContainer = document.getElementById("previewContainer");
    const officialImageInput = document.getElementById("officialImageFile");
    const officialPreviewContainer = document.getElementById("officialPreviewContainer");
    const officialImportStatus = document.getElementById("officialImportStatus");
    const resultEl = document.getElementById("result");
  
    let previewUrls = [];
    let selectedFiles = [];
    let officialPreviewUrls = [];
    let selectedOfficialFiles = [];
  
    function renderPreviews(files) {
      previewUrls.forEach((u) => URL.revokeObjectURL(u));
      previewUrls = [];
      previewContainer.innerHTML = "";
  
      files.forEach((file) => {
        const url = URL.createObjectURL(file);
        previewUrls.push(url);
  
        const img = document.createElement("img");
        img.src = url;
        img.alt = "プレビュー";
        previewContainer.appendChild(img);
      });
    }
  
    imageInput.addEventListener("change", () => {
      selectedFiles = Array.from(imageInput.files || []);
      renderPreviews(selectedFiles);
    });

    function renderOfficialPreviews(files) {
      officialPreviewUrls.forEach((u) => URL.revokeObjectURL(u));
      officialPreviewUrls = [];
      officialPreviewContainer.innerHTML = "";
      files.forEach((file) => {
        const url = URL.createObjectURL(file);
        officialPreviewUrls.push(url);
        const img = document.createElement("img");
        img.src = url;
        img.alt = "正式情報プレビュー";
        officialPreviewContainer.appendChild(img);
      });
    }

    officialImageInput.addEventListener("change", () => {
      selectedOfficialFiles = Array.from(officialImageInput.files || []);
      renderOfficialPreviews(selectedOfficialFiles);
      officialImportStatus.textContent = "";
    });

    document.getElementById("importOfficialBtn").addEventListener("click", async () => {
      officialImportStatus.textContent = "";
      if (selectedOfficialFiles.length === 0) {
        officialImportStatus.textContent = "正式情報用の画像を1枚以上選択してください。";
        return;
      }
      officialImportStatus.textContent = "テキストを取り込み中...";
      try {
        const images = [];
        for (const file of selectedOfficialFiles) {
          images.push({
            image_base64: await fileToBase64(file),
            mime_type: file.type || "image/png"
          });
        }
        const res = await fetch("/api/extract-official", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ images })
        });
        const data = await res.json();
        if (!res.ok) {
          officialImportStatus.textContent =
            "取り込みエラー: " + (data.detail ? JSON.stringify(data.detail) : JSON.stringify(data));
          return;
        }
        document.getElementById("officialText").value = data.text || "";
        officialImportStatus.textContent = "取り込みが完了しました。必要なら編集してからチェック実行してください。";
      } catch (err) {
        officialImportStatus.textContent = "通信エラー: " + String(err);
      }
    });
  
    ["dragenter", "dragover"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add("dragover");
      });
    });
  
    ["dragleave", "dragend", "drop"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove("dragover");
      });
    });
  
    dropZone.addEventListener("drop", (e) => {
      const files = Array.from(e.dataTransfer.files || []).filter((file) =>
        ["image/png", "image/jpeg", "image/webp", "image/gif"].includes(file.type)
      );
  
      if (files.length === 0) {
        resultEl.textContent = "画像ファイルのみドロップできます。";
        return;
      }
  
      selectedFiles = files;
      renderPreviews(selectedFiles);
      resultEl.textContent = `${selectedFiles.length}枚の画像を読み込みました。`;
    });
  
    document.getElementById("runBtn").addEventListener("click", async () => {
      const files = selectedFiles;
      const officialText = document.getElementById("officialText").value;
      const referenceUrl = document.getElementById("referenceUrl").value;
  
      if (files.length === 0) {
        resultEl.textContent = "チェック対象の画像を1枚以上選択してください。";
        return;
      }

      if (!officialText.trim() && selectedOfficialFiles.length === 0) {
        resultEl.textContent =
          "正式情報は、テキスト貼り付けとスクショのどちらか一方以上を指定してください。";
        return;
      }
  
      resultEl.textContent = "チェック中...";
  
      try {
        const images = [];
        for (const file of files) {
          const imageBase64 = await fileToBase64(file);
          images.push({
            image_base64: imageBase64,
            mime_type: file.type || "image/png"
          });
        }

        const official_images = [];
        for (const file of selectedOfficialFiles) {
          official_images.push({
            image_base64: await fileToBase64(file),
            mime_type: file.type || "image/png"
          });
        }
  
        const payload = {
          images,
          official_text: officialText,
          official_images,
          reference_url: referenceUrl
        };
  
        const res = await fetch("/api/check", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
  
        const data = await res.json();
  
        if (!res.ok) {
          resultEl.innerHTML = `
  <div class="result-header result-fix">エラーが発生しました</div>
  <div class="result-card">
    <div><span class="result-label">status:</span> ${res.status}</div>
    <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
  </div>
`;
          return;
        }
  
        resultEl.innerHTML = renderResult(data);
      } catch (error) {
        resultEl.innerHTML = `
  <div class="result-header result-fix">通信エラー</div>
  <div class="result-card">${escapeHtml(String(error))}</div>
`;
      }
    });
  </script>
  </body>
</html>

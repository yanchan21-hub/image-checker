<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画像校正チェック</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }

     /* ←ここに追加 */
  #dropZone {
    ...
  }

  #dropZone.dragover {
    ...
  }
  
    h1 {
      margin-bottom: 24px;
    }
    .row {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    textarea, input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 14px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      margin-top: 8px;
    }
    pre {
      background: #f6f6f6;
      padding: 16px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 8px;
    }
    .hint {
      color: #666;
      font-size: 13px;
      margin-top: 6px;
    }
    #previewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    #previewContainer img {
      max-width: 100%;
      max-height: 280px;
      width: auto;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h1>画像校正・商品情報照合</h1>

  <div class="row">
    <label for="imageFile">画像（複数可）</label>
    <input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
    <div id="dropZone">
      ここに画像をドラッグ＆ドロップ
      <div class="hint">または上のボタンから選択</div>
    </div>
    <div class="hint">PNG / JPG / GIF / WEBP を1枚以上選択（Ctrl / Shift で複数選択可）</div>
    <div id="previewContainer"></div>
  </div>

  <div class="row">
    <label for="officialText">正式情報（スプシコピー）</label>
    <textarea id="officialText" placeholder="商品名、価格、容量、発売日などを貼り付け"></textarea>
  </div>

  <div class="row">
    <label for="referenceUrl">参照URL（任意）</label>
    <input type="text" id="referenceUrl" placeholder="https://example.com" />
  </div>

  <div class="row">
    <button id="runBtn">チェック実行</button>
  </div>

  <h2>結果</h2>
  <pre id="result">ここに結果が表示されます</pre>

  <script>
    async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          const base64 = result.split(",")[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const imageInput = document.getElementById("imageFile");
    const previewContainer = document.getElementById("previewContainer");
    const resultEl = document.getElementById("result");
    let previewUrls = [];

    imageInput.addEventListener("change", () => {
      previewUrls.forEach((u) => URL.revokeObjectURL(u));
      previewUrls = [];
      previewContainer.innerHTML = "";
      const files = Array.from(imageInput.files || []);
      files.forEach((file) => {
        const url = URL.createObjectURL(file);
        previewUrls.push(url);
        const img = document.createElement("img");
        img.src = url;
        img.alt = "プレビュー";
        previewContainer.appendChild(img);
      });
    });

    document.getElementById("runBtn").addEventListener("click", async () => {
      const files = Array.from(imageInput.files || []);
      const officialText = document.getElementById("officialText").value;
      const referenceUrl = document.getElementById("referenceUrl").value;

      if (files.length === 0) {
        resultEl.textContent = "画像を1枚以上選択してください。";
        return;
      }

      resultEl.textContent = "チェック中...";

      try {
        const images = [];
        for (const file of files) {
          const imageBase64 = await fileToBase64(file);
          images.push({
            image_base64: imageBase64,
            mime_type: file.type || "image/png"
          });
        }

        const payload = {
          images,
          official_text: officialText,
          reference_url: referenceUrl
        };

        const res = await fetch("/api/check", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          resultEl.textContent = JSON.stringify({
            status: res.status,
            error: data
          }, null, 2);
          return;
        }

        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        resultEl.textContent = JSON.stringify({
          error: String(error)
        }, null, 2);
      }
    });
  </script>
</body>
</html>
